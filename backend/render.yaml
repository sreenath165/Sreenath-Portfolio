services:
  - type: web
    name: portfolio-ai-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: CHROMA_PERSIST_DIR
        value: ./chroma_db
      - key: COLLECTION_NAME
        value: portfolio_docs
      - key: RETRIEVAL_K
        value: 5
      - key: CHUNK_SIZE
        value: 500
      - key: CHUNK_OVERLAP
        value: 100
    healthCheckPath: /health
    autoDeploy: true
